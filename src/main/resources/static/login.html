<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Вхід — HeadCount</title>
    <link rel="icon" type="image/png" href="/favicon%20orig%20big.png">
    <style>
        :root{font-family:system-ui,sans-serif;color:#1f2937;background:#f3f4f6}body{margin:0;min-height:100vh}header{padding:1rem 2rem;background:#172554;color:white}header h1{margin:0}main{display:grid;place-items:center;padding:3rem 1rem}.login-card{box-sizing:border-box;width:min(420px,100%);padding:1.5rem;background:white;border-radius:.7rem;box-shadow:0 12px 30px #0f172a1f}.login-card h2{margin-top:0}.login-form{display:grid;gap:1rem}.field{display:grid;gap:.35rem}.field label{font-weight:600}.field input{box-sizing:border-box;width:100%;padding:.7rem;border:1px solid #9ca3af;border-radius:.35rem;font:inherit}.login-form button{padding:.7rem;border:0;border-radius:.35rem;background:#172554;color:white;font:inherit;font-weight:600;cursor:pointer}.login-form button:hover{background:#1e3a8a}.login-form button:disabled{cursor:wait;opacity:.65}.message{padding:.75rem;margin-bottom:1rem;border-radius:.4rem}.message.error{background:#fee2e2;color:#991b1b}.message.success{background:#dcfce7;color:#166534}
    </style>
</head>
<body>
<header><h1>HeadCount</h1></header>
<main><section class="login-card" aria-labelledby="login-title">
    <h2 id="login-title">Вхід до системи</h2>
    <div id="login-message" class="message" hidden></div>
    <form id="login-form" class="login-form" action="/login" method="post">
        <div class="field"><label for="username">Ім’я користувача</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button id="login-submit" type="submit" disabled>Увійти</button>
    </form>
</section></main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
