<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeadCount</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root { font-family: system-ui, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { margin: 0; } header { display:flex; gap:1rem; align-items:center; padding:1rem 2rem; background:#172554; color:white; }
        header h1 { margin:0; flex:1; } button, input, select, textarea { padding:.55rem; }
        button { cursor:pointer; } main { max-width:1100px; margin:auto; padding:1.5rem; }
        .toolbar, .event { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; background:white; padding:1rem; border-radius:.6rem; margin-bottom:1rem; }
        .message { padding:.8rem; margin-bottom:1rem; border-radius:.4rem; background:#dbeafe; }.message.error{background:#fee2e2}.message.success{background:#dcfce7}
        .tree, .participants { display:grid; gap:.75rem; }.unit { background:white; border-left:4px solid #64748b; padding:.8rem; margin-left:calc(var(--depth) * 1.25rem); }
        .participant { background:white; padding:1rem; border-radius:.5rem; border-left:7px solid #ef4444; cursor:pointer; transition:box-shadow .15s,transform .15s; }.participant:hover,.participant:focus-visible{box-shadow:0 4px 14px #0f172a26;outline:2px solid #2563eb;outline-offset:2px}.participant.SAFE{border-color:#22c55e}.participant.NEED_HELP{border-color:#f59e0b;background:#fffbeb}
        .participant-actions, .event-actions { display:flex; gap:.5rem; margin-top:.75rem; flex-wrap:wrap; }.event-details{display:grid;gap:.25rem}.event-actions{margin-left:auto}.muted{color:#64748b;font-size:.9rem}.admin-link{color:white}.danger{background:#b91c1c;color:white;border:1px solid #991b1b}.danger:hover{background:#991b1b}dialog{border:0;border-radius:.7rem;box-shadow:0 20px 45px #0005;width:min(520px,calc(100% - 2rem));padding:1.25rem}dialog::backdrop{background:#11182799}dialog h2{margin-top:0}.dialog-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}.participant-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem 1.25rem;margin:0}.participant-detail{min-width:0}.participant-detail dt{font-size:.85rem;color:#64748b}.participant-detail dd{margin:.2rem 0 0;overflow-wrap:anywhere}@media(max-width:600px){.participant-details{grid-template-columns:1fr}header{padding:1rem;flex-wrap:wrap}main{padding:.75rem}}
    </style>
</head>
<body>
<header><h1>HeadCount</h1><span id="current-user"></span><a id="admin-link" class="admin-link" href="/admin.html" hidden>Адміністрування</a><button id="logout">Вийти</button></header>
<main>
    <div id="message-container" hidden></div>
    <section class="toolbar">
        <label>Область <select id="scope-select"></select></label>
        <input id="event-title" value="HeadCount" aria-label="Назва події">
        <button id="start-headcount" hidden>Оголосити HeadCount</button>
        <button id="refresh">Оновити</button>
    </section>
    <section id="active-event" class="event"><strong>Активної події немає</strong></section>
    <h2>Організаційна структура</h2><section id="organization-tree" class="tree"></section>
    <h2>Учасники</h2><section id="participants" class="participants"></section>
</main>
<dialog id="event-action-dialog">
    <h2 id="event-action-title"></h2>
    <p id="event-action-message"></p>
    <div class="dialog-actions"><button id="event-action-back" type="button">Скасувати</button><button id="event-action-confirm" type="button"></button></div>
</dialog>
<dialog id="participant-details-dialog">
    <h2>Дані учасника</h2>
    <div id="participant-details-content">Завантаження...</div>
    <div class="dialog-actions"><button id="close-participant-details" type="button">Закрити</button></div>
</dialog>
<script type="module" src="/js/index.js"></script>
</body>
</html>
